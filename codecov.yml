coverage:
  status:
    project:
      default:
        # Minimum overall coverage — raised as business modules and their tests are added
        target: 30%
        threshold: 2%
    patch:
      default:
        # New code introduced in each PR must be at least 50% covered
        target: 50%
        threshold: 5%

flags:
  api:
    paths:
      - apps/api/src/
    carryforward: false
  web:
    paths:
      - apps/web/src/
    carryforward: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true # only post a comment if coverage changed

ignore:
  # API
  - "apps/api/src/main.ts"
  - "apps/api/prisma/**"
  - "apps/api/test/**"
  - "apps/api/dist/**"
  # Web
  - "apps/web/src/app/**"
  - "apps/web/src/components/ui/**"
  - "apps/web/src/test/**"
  - "apps/web/.next/**"
